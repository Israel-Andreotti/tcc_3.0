<i class="bi bi-info-circle text-muted-hd small" role="button"
   data-usuario-info
   data-nome="{{ usuario.get_full_name|default:usuario.username }}"
   data-matricula="{{ usuario.matricula|default:'' }}"
   data-perfil="{{ usuario.get_perfil_display }}"
   data-setor="{{ usuario.setor|default:'' }}"
   data-email="{{ usuario.email|default:'' }}"
   data-telefone="{{ usuario.telefone|default:'' }}"></i>
