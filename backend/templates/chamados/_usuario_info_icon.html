{% load chamado_extras %}
<span class="hd-avatar-sm{% if usuario.vip %} hd-avatar-vip{% endif %}" role="button" tabindex="0"
   data-usuario-info
   data-nome="{{ usuario.get_full_name|default:usuario.username }}"
   data-matricula="{{ usuario.matricula|default:'' }}"
   data-perfil="{{ usuario.get_perfil_display }}"
   data-setor="{{ usuario.setor|default:'' }}"
   data-email="{{ usuario.email|default:'' }}"
   data-telefone="{{ usuario.telefone|default:'' }}"
   data-vip="{% if usuario.vip %}Sim{% else %}Não{% endif %}"
   title="{% if usuario.vip %}Solicitante VIP — {% endif %}Ver detalhes">{{ usuario.get_full_name|default:usuario.username|iniciais }}</span>
