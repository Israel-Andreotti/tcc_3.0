{% extends 'base.html' %}
{% block title %}Setores{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 class="h3 m-0"><i class="bi bi-diagram-3"></i> Setores</h1>
    <a href="{% url 'usuarios:setor_cadastrar' %}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Cadastrar setor</a>
</div>

<div class="hd-card p-0 table-responsive">
    <table class="table hd-table align-middle mb-0">
        <thead>
            <tr>
                <th class="ps-3">Nome</th>
            </tr>
        </thead>
        <tbody>
            {% for setor in setores %}
            <tr>
                <td class="ps-3">{{ setor.nome }}</td>
            </tr>
            {% empty %}
            <tr><td class="text-center text-muted-hd py-5">Nenhum setor cadastrado.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
