{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center hd-login-page">
    <div class="col-md-4">
        <div class="hd-card">
            <div class="hd-login-icon"><i class="bi bi-headset"></i></div>
            <h1 class="h3 mb-1 text-center">Helpdesk TI</h1>
            <p class="text-muted-hd text-center mb-4">Sistema de Gerenciamento de Chamados</p>
            <form method="post">
                {% csrf_token %}
                {% if form.non_field_errors %}
                <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
                {% endif %}
                <div class="mb-3">
                    <label class="form-label" for="{{ form.username.id_for_label }}">Usuário</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
